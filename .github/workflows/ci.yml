# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # enables PNPM store cache automatically

      - name: Use pnpm from packageManager via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Build & start services (example placeholders) ---
      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Lint
        run: pnpm -w run lint

      - name: Run Playwright tests
        run: pnpm -w exec playwright install --with-deps && pnpm -w run test:e2e

      # Optional: always upload logs on failure
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            **/playwright-report
            **/test-results
            **/logs
