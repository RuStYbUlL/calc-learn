name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # --- Build & start services ---
      - name: Build backend
        run: pnpm run build

      - name: Start backend (background)
        run: |
          node backend/dist/server.js > backend.log 2>&1 & echo $! > backend.pid
          sleep 1
          echo "Backend PID: $(cat backend.pid)"

      - name: Start frontend (background)
        run: |
          pnpm exec http-server ./frontend -p 3000 > frontend.log 2>&1 & echo $! > frontend.pid
          sleep 1
          echo "Frontend PID: $(cat frontend.pid)"

      - name: Wait for services (5 min timeout)
        run: |
          pnpm add -D wait-on
          npx wait-on --timeout 300000 http://localhost:9999/health
          npx wait-on --timeout 300000 http://localhost:3000
          curl -fsS http://localhost:9999/health || (echo "backend health failed" && false)
          curl -fsS http://localhost:3000 || (echo "frontend root failed" && false)

      # --- PR checklist gates ---
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests (Playwright)
        run: pnpm test

      # --- Always upload logs if something failed, to debug startup issues ---
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log

      # --- Cleanup background processes so runners don't hang ---
      - name: Stop services
        if: always()
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
          if [ -f frontend.pid ]; then kill $(cat frontend.pid) || true; fi
